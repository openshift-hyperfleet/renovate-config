default_install_hook_types: [pre-commit, commit-msg]

repos:
  # Secret scanning, matching the service-repository baseline.
  - repo: https://github.com/leaktk/leaktk
    rev: c6f5a11329736a8dc1551a84603f117bd9ed498e  # frozen: v0.3.12
    hooks:
      - id: leaktk.git.pre-commit

  # Keep commit messages consistent with other HyperFleet repositories.
  - repo: https://github.com/openshift-hyperfleet/hyperfleet-hooks
    rev: d9aab6d723c9246bd2f63a982bf1d9cf0805b3a4  # frozen: v0.3.0
    hooks:
      - id: hyperfleet-commitlint
        stages: [commit-msg]

  # Generic file and JSON hygiene.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-added-large-files

  # Renovate validates both schema and configuration semantics.
  - repo: local
    hooks:
      - id: renovate-config-validator
        name: validate Renovate preset
        language: system
        entry: make validate
        pass_filenames: false
        files: ^default\.json$
